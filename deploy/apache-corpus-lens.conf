# Inside the existing TLS <VirtualHost *:443>, next to the /nauvoo-mcp block.
# Requires mod_proxy and mod_proxy_http (already enabled for nauvoo-mcp).
#
# Public URL:  https://<host>/corpus-lens   →   http://127.0.0.1:8765/mcp
#
# Authentication is NOT done here: Apache forwards the Authorization header
# untouched and the Node server checks the bearer token.
#
# Leave ProxyPreserveHost OFF (the default). The server only accepts requests
# whose Host is 127.0.0.1:8765 / localhost:8765, which is what ProxyPass sends.
# If this vhost sets ProxyPreserveHost On, add the public hostname to
# CORPUS_ALLOWED_HOSTS in the unit instead.

<Location /corpus-lens>
    ProxyPass         http://127.0.0.1:8765/mcp timeout=60
    ProxyPassReverse  http://127.0.0.1:8765/mcp

    # A query is a few hundred bytes; refuse anything large at the door.
    LimitRequestBody 65536
</Location>
